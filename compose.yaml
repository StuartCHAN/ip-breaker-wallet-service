services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: patex_wallet
      MYSQL_USER: patex
      MYSQL_PASSWORD: patex_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_password"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/patex_wallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: patex
      DB_PASSWORD: patex_dev_password
      REDIS_HOST: redis
    ports: ["8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  mysql-data:

