spring:
  application:
    name: patex-wallet-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/patex_wallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:patex}
    password: ${DB_PASSWORD:patex_dev_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
server:
  shutdown: graceful

