spring:
  application:
    name: ip-breaker-wallet-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ip_breaker_wallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:ipbreaker}
    password: ${DB_PASSWORD:ip_breaker_dev_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
server:
  shutdown: graceful
wallet:
  chain:
    rpc-url: ${SEPOLIA_RPC_URL:http://localhost:8545}
    connect-timeout: ${RPC_CONNECT_TIMEOUT:5s}
    read-timeout: ${RPC_READ_TIMEOUT:15s}
    retry-attempts: ${RPC_RETRY_ATTEMPTS:4}
    retry-initial-backoff: ${RPC_RETRY_INITIAL_BACKOFF:250ms}
  scanner:
    network-code: ${SCANNER_NETWORK_CODE:SEPOLIA}
    batch-size: ${SCANNER_BATCH_SIZE:25}
    lease-duration: ${SCANNER_LEASE_DURATION:45s}
    fixed-delay: ${SCANNER_FIXED_DELAY:5s}
  confirmation:
    batch-size: ${CONFIRMATION_BATCH_SIZE:100}
    fixed-delay: ${CONFIRMATION_FIXED_DELAY:7s}
  reconciliation:
    fixed-delay: ${RECONCILIATION_FIXED_DELAY:5m}
  rights:
    verify-contract-code: ${RIGHTS_VERIFY_CONTRACT_CODE:true}
    backfill:
      batch-size: ${RIGHTS_BACKFILL_BATCH_SIZE:10}
      lease-duration: ${RIGHTS_BACKFILL_LEASE_DURATION:45s}
      fixed-delay: ${RIGHTS_BACKFILL_FIXED_DELAY:15s}
